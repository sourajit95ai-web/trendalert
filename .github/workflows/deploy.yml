name: deploy

# Two ways to deploy:
#   1. Push to main            -> tests, then FULL deploy (both functions + dashboard)
#   2. Actions tab -> "deploy" -> "Run workflow" on ANY branch:
#        deploy_backend=true   -> also redeploy both Cloud Functions from that branch
#
# THE DASHBOARD IS frontend/next/ (-> dashboard-next.html by frontend/build_next.py),
# published to gs://BUCKET/next/dashboard.html. It is the only dashboard this
# workflow publishes, and it is what the alert posters link to
# (DASHBOARD_URL in backend/daily_summary.py).
#
# FROZEN 2026-08-15 -- the older v2 dashboard is no longer built, checked or
# published. frontend/dashboard.html and its generator frontend/build_dashboard.py
# stay in the repo as the record, but nothing runs them, so the committed artifact
# WILL drift from frontend/v2/ and must not be trusted or redeployed as-is.
# These bucket objects are frozen in place, still live but never updated again:
#   gs://BUCKET/dashboard.html      (v2 build of 2026-08-13)
#   gs://BUCKET/dev/dashboard.html  (v2 staging build of 2026-08-12)
# NOTE frontend/v2/ itself is NOT dead: frontend/next/index.html reaches back
# into ../v2/ for trendalert-core.js, theme.css, the Nocturne tokens, Inter and
# lightweight-charts. It is the redesign's library -- keep editing it.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   GCP_SA_KEY   - key.json of the gh-deploy service account (README §3)
#   GCP_PROJECT  - GCP project id
#   GCS_BUCKET   - bucket name (no gs:// prefix)
# Optional (EOD alerts, see OPS.md):
#   SMTP_USER        - sender address    ALERT_TO - comma-separated recipients
#   TELEGRAM_CHAT_ID - Telegram chat to notify (token lives in Secret Manager)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Also deploy both Cloud Functions from this branch"
        type: boolean
        default: false

env:
  REGION: us-central1
  PIPELINE_FN: trendalert-pipeline   # entry point: main (backend/main.py) — matches the function already deployed in trendalert-prod
  NOTES_FN: notes           # entry point: notes  (backend/notes_function.py)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest backend/tests -q
      # dashboard-next.html is generated from frontend/next/ -- fail if the
      # committed artifact no longer matches its source tree.
      # (The matching --check for the frozen v2 dashboard was dropped on
      # 2026-08-15: frontend/v2/trendalert-core.js is still edited because the
      # redesign imports it, so the check would fail on every core change and
      # demand a rebuild of an artifact nobody publishes any more.)
      - run: python frontend/build_next.py --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      # ---- backend: both Cloud Functions (main push, or dispatch with deploy_backend) ----
      - name: Deploy pipeline function
        if: github.event_name == 'push' || inputs.deploy_backend
        # Secrets arrive through env rather than being pasted into the script,
        # so a value containing a quote cannot break out of the shell string.
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SECRETS="ALPACA_KEY_ID=alpaca-key-id:latest,ALPACA_SECRET_KEY=alpaca-secret-key:latest"
          # smtp-pass / telegram-bot-token are optional (OPS.md); only mount what exists
          if gcloud secrets describe smtp-pass >/dev/null 2>&1; then
            SECRETS="$SECRETS,SMTP_PASS=smtp-pass:latest"
          fi
          if gcloud secrets describe telegram-bot-token >/dev/null 2>&1; then
            SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=telegram-bot-token:latest"
          fi
          gcloud functions deploy "$PIPELINE_FN" \
            --gen2 --runtime python312 --region "$REGION" \
            --source backend --entry-point main \
            --trigger-http --allow-unauthenticated \
            --memory 512Mi --timeout 300s \
            --set-secrets "$SECRETS" \
            --set-env-vars "^|^GCS_BUCKET=$GCS_BUCKET|SMTP_USER=$SMTP_USER|ALERT_TO=$ALERT_TO|TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
          # ^|^ selects | as the separator instead of the default comma.
          # ALERT_TO is a COMMA-SEPARATED recipient list, so under the default
          # delimiter a second address splits the dict and the deploy dies with
          # "Bad syntax for dict arg" -- exactly what happened the first time a
          # second recipient was added. A pipe cannot occur in an email address,
          # a bucket name or a chat id, so it is safe as the separator here.

      - name: Deploy notes function
        if: github.event_name == 'push' || inputs.deploy_backend
        run: |
          gcloud functions deploy "$NOTES_FN" \
            --gen2 --runtime python312 --region "$REGION" \
            --source backend --entry-point notes \
            --trigger-http --allow-unauthenticated \
            --set-secrets "ADMIN_TOKEN=trendalert-admin-token:latest" \
            --set-env-vars "GCS_BUCKET=${{ secrets.GCS_BUCKET }},ALLOWED_ORIGIN=https://storage.googleapis.com"

      # ---- frontend: the dashboard to GCS ----
      # no-cache so a refresh always shows the newest deploy (GCS defaults to 1h caching).
      # The page inlines its runtime, design tokens and vendored libraries, and
      # no-cache means every load pays it, so it uploads with -Z
      # (Content-Encoding: gzip, ~230KB on the wire). -Z also stamps no-transform
      # onto Cache-Control, so the object is only ever served gzipped -- fine for
      # browsers, which all send Accept-Encoding: gzip.
      # -h is a top-level gsutil flag; -Z belongs to the cp subcommand.
      #
      # This writes ONLY /next/dashboard.html. The step that published the v2
      # build to the bucket root (and to /dev/) was removed on 2026-08-15; both
      # of those objects are frozen. Promoting this page to the root is a
      # deliberate edit here, and would want a redirect left at the old URL.
      - name: Publish redesign
        run: |
          gsutil -h "Cache-Control:no-cache" -h "Content-Type:text/html" \
            cp -Z frontend/dashboard-next.html "gs://${{ secrets.GCS_BUCKET }}/next/dashboard.html"
          echo "Published frontend/dashboard-next.html to gs://${{ secrets.GCS_BUCKET }}/next/dashboard.html"
