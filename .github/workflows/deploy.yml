name: deploy

# Two ways to deploy:
#   1. Push to main            -> tests, then FULL prod deploy (both functions + dashboard)
#   2. Actions tab -> "deploy" -> "Run workflow" on ANY branch:
#        target=dev  (default) -> dashboard to gs://BUCKET/dev/dashboard.html (staging)
#        target=prod           -> dashboard to gs://BUCKET/dashboard.html
#        deploy_backend=true   -> also redeploy both Cloud Functions from that branch
#        variant=v2            -> publish the redesign instead, to dashboard-v2.html
#                                 (dev/dashboard-v2.html when target=dev). v2 has its
#                                 own object names, so it can never overwrite the live
#                                 dashboard; promoting it is a rename, not a flag.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   GCP_SA_KEY   - key.json of the gh-deploy service account (README §3)
#   GCP_PROJECT  - GCP project id
#   GCS_BUCKET   - bucket name (no gs:// prefix)
# Optional (EOD alerts, see OPS.md):
#   SMTP_USER        - sender address    ALERT_TO - comma-separated recipients
#   TELEGRAM_CHAT_ID - Telegram chat to notify (token lives in Secret Manager)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish the dashboard"
        type: choice
        options: [dev, prod]
        default: dev
      deploy_backend:
        description: "Also deploy both Cloud Functions from this branch"
        type: boolean
        default: false
      variant:
        description: "Which dashboard to publish (v2 never overwrites dashboard.html)"
        type: choice
        options: [v1, v2]
        default: v1

env:
  REGION: us-central1
  PIPELINE_FN: trendalert-pipeline   # entry point: main (backend/main.py) — matches the function already deployed in trendalert-prod
  NOTES_FN: notes           # entry point: notes  (backend/notes_function.py)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest backend/tests -q
      # dashboard-v2.html is generated from frontend/v2/ -- fail if the
      # committed artifact no longer matches its source tree
      - run: python frontend/build_v2.py --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      # ---- backend: both Cloud Functions (main push, or dispatch with deploy_backend) ----
      - name: Deploy pipeline function
        if: github.event_name == 'push' || inputs.deploy_backend
        run: |
          SECRETS="ALPACA_KEY_ID=alpaca-key-id:latest,ALPACA_SECRET_KEY=alpaca-secret-key:latest"
          # smtp-pass / telegram-bot-token are optional (OPS.md); only mount what exists
          if gcloud secrets describe smtp-pass >/dev/null 2>&1; then
            SECRETS="$SECRETS,SMTP_PASS=smtp-pass:latest"
          fi
          if gcloud secrets describe telegram-bot-token >/dev/null 2>&1; then
            SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=telegram-bot-token:latest"
          fi
          gcloud functions deploy "$PIPELINE_FN" \
            --gen2 --runtime python312 --region "$REGION" \
            --source backend --entry-point main \
            --trigger-http --allow-unauthenticated \
            --memory 512Mi --timeout 300s \
            --set-secrets "$SECRETS" \
            --set-env-vars "GCS_BUCKET=${{ secrets.GCS_BUCKET }},SMTP_USER=${{ secrets.SMTP_USER }},ALERT_TO=${{ secrets.ALERT_TO }},TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Deploy notes function
        if: github.event_name == 'push' || inputs.deploy_backend
        run: |
          gcloud functions deploy "$NOTES_FN" \
            --gen2 --runtime python312 --region "$REGION" \
            --source backend --entry-point notes \
            --trigger-http --allow-unauthenticated \
            --set-env-vars "GCS_BUCKET=${{ secrets.GCS_BUCKET }},ALLOWED_ORIGIN=https://storage.googleapis.com"

      # ---- frontend: single-file dashboard to GCS ----
      # no-cache so a refresh always shows the newest deploy (GCS defaults to 1h caching)
      #
      # v2 is the redesign (frontend/dashboard-v2.html, generated by
      # frontend/build_v2.py). It publishes to its own object names and can
      # never overwrite dashboard.html -- promoting it is a deliberate rename,
      # not a deploy flag. It is also ~730KB uncompressed against v1's ~155KB,
      # and no-cache means every load pays that, so v2 uploads with -Z
      # (Content-Encoding: gzip, ~290KB on the wire; GCS transcodes for any
      # client that somehow does not accept gzip).
      - name: Publish dashboard
        run: |
          if [ "${{ inputs.variant }}" = "v2" ]; then
            SRC="frontend/dashboard-v2.html"; NAME="dashboard-v2.html"; GZIP="-Z"
          else
            SRC="frontend/dashboard.html";    NAME="dashboard.html";    GZIP=""
          fi
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.target }}" = "prod" ]; then
            DEST="gs://${{ secrets.GCS_BUCKET }}/$NAME"
          else
            DEST="gs://${{ secrets.GCS_BUCKET }}/dev/$NAME"
          fi
          # -h is a top-level gsutil flag; -Z belongs to the cp subcommand
          gsutil -h "Cache-Control:no-cache" -h "Content-Type:text/html" \
            cp $GZIP "$SRC" "$DEST"
          echo "Published $SRC to $DEST"
